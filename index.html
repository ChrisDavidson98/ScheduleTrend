// ════════════════════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7xpkt_RLdH2d7JNBbD4T7gJPOW3ulBh7ukQhTseds8uwdmTIapuq6Nwwpgqi7SYPc/exec';

const STAGE_ORDER = [
  'HOLD PAINT', 'Paint Ready/Painting', "Trimm'd", 'Triming', 'Trim Ready-HOLD', 'Trim Rdy',
  "Tape'g", 'Hung', 'Batts', 'RI Passed', 'ReRI Inspect', 'RI Inspect',
  'E-Mech', 'Furdown', 'P-Mech', 'M-Mech', 'Roof',
];

// Per-stage duration reference (min/typical/max, in business days), learned from
// 8 real historical houses' CoConstruct schedule exports (see PRD: Duration Baseline
// + Drift Layer). Not guessed — every number here traces back to a specific measured
// CoConstruct task, except where noted 'estimated split' (Hung/Tape'g), which divides
// CoConstruct's single combined "Drop Sheetrock" number using Chris's own field
// estimate of the hang/tape/spray-sand breakdown, since CoConstruct doesn't track
// those as separate tasks the way the weekly PDF does.
// Deliberately absent: RI Passed, Trimm'd, Trim Ready-HOLD, HOLD PAINT — these are
// ad-hoc/manual flags with no reliable CoConstruct-derived duration (a hold is a
// deliberate decision, not something to measure a "normal" length for), so they
// never get a baseline and therefore never get flagged as running long/stuck.
const DURATION_BASELINE = {
  'Roof': { min: 4, typical: 4, max: 4, source: 'measured — Load Roof' },
  'M-Mech': { min: 5, typical: 12, max: 24, source: 'measured — HVAC Rough In' },
  'P-Mech': { min: 5, typical: 5, max: 12, source: 'measured — Plumbing Rough In' },
  'Furdown': { min: 1, typical: 1, max: 4, source: 'measured — Fur Downs' },
  'E-Mech': { min: 10, typical: 18, max: 22, source: 'measured — Electric Rough In' },
  'Hung': { min: 1, typical: 2, max: 2, source: 'estimated split of combined Drop Sheetrock number' },
  "Tape'g": { min: 7, typical: 8, max: 9, source: 'estimated split of combined Drop Sheetrock number' },
  'RI Inspect': { min: 4, typical: 8, max: 14, source: 'measured — combined RI Inspection + Punch List + ReRI window' },
  'ReRI Inspect': { min: 4, typical: 8, max: 14, source: 'same combined window as RI Inspect' },
  'Batts': { min: 1, typical: 1, max: 1, source: 'measured — AIC Insulation' },
  'Trim Rdy': { min: 1, typical: 1, max: 1, source: 'measured — Trim & Door Drop (milestone event)' },
  'Triming': { min: 6, typical: 15, max: 40, source: 'measured — Trim Carpenters (40 = a real vendor-backlog wait, not an outlier to discard)' },
  'Paint Ready/Painting': { min: 7, typical: 10, max: 17, source: 'measured — Paint' },
};

// Schedule Trend only observes a house once a week (one PDF upload), but several
// baseline stages have a max under a week (Roof 4d, Furdown 4d, Batts 1d, Trim Rdy
// 1d, Hung 2d). Comparing elapsed days against a baseline that fine is noise at
// weekly resolution — nearly every house would read as "stuck" in its first week
// there purely from sampling granularity, not because anything's actually wrong.
// (Trim Rdy specifically is also just wrong to hold to a tight day count at all —
// per Chris, it's genuinely waiting-on-labor-availability, same as Triming.)
// For those short-baseline stages, the reliable signal Schedule Trend actually has
// is simpler and matches how Chris described it: did the stage change between
// consecutive weekly uploads, or has it sat still. That's what weeksSeen answers.
const STALL_MODE_MAX_DAYS = 5;

// Classifies how a house's current (ongoing) time-in-stage compares to the
// baseline. null = no baseline for this stage (HOLD stages, RI Passed, Trimm'd, or
// anything unrecognized) — deliberately never flagged, since there's nothing to
// compare against (a hold is a deliberate decision, not a problem).
function classifyDrift(stage, days, weeksSeen) {
  const b = DURATION_BASELINE[stage];
  if (!b) return null;
  if (b.max <= STALL_MODE_MAX_DAYS) {
    if (weeksSeen >= 3) return 'stuck';
    if (weeksSeen >= 2) return 'watch';
    return 'normal';
  }
  if (days > b.max * 1.5) return 'stuck';
  if (days > b.max) return 'watch';
  return 'normal';
}

const DRIFT_META = {
  normal: { label: 'ON PACE', color: '#4ade80' },
  watch: { label: 'RUNNING LONG', color: '#fbbf24' },
  stuck: { label: 'STUCK', color: '#f87171' },
};

const STAGE_COLOR = (stage) => {
  const i = STAGE_ORDER.indexOf(stage);
  if (i === -1) return '#6b7280';
  // Furthest-along stages read warm/complete, earliest stages read cool/early.
  const t = i / (STAGE_ORDER.length - 1);
  const r = Math.round(96 + t * (250 - 96));
  const g = Math.round(165 - t * (85));
  const b = Math.round(250 - t * (200));
  return `rgb(${r},${g},${b})`;
};

// Mirrors the backend's SUBDIVISION_STREETS keys — used to derive a
// superintendent filter from whatever subdivision a house got tagged with.

const ASK_EXAMPLES = [

  "What's Randy working on right now?",
];

function fmtDate(d) {
  if (!d) return null;
  try { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  catch (e) { return d; }
}

async function callBackendGet(action, params) {
  const url = new URL(SCRIPT_URL);
  url.searchParams.set('token', APP_TOKEN);
  url.searchParams.set('action', action);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function callBackendPost(action, payload) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: APP_TOKEN, ...payload }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── Stage pipeline bar — the one signature visual: shows how the current
// snapshot's houses are distributed across the build pipeline at a glance ──
function StagePipeline({ houses }) {
  const counts = {};
  STAGE_ORDER.forEach((s) => (counts[s] = 0));
  houses.forEach((h) => { if (counts[h.stage] !== undefined) counts[h.stage]++; else counts[h.stage] = (counts[h.stage] || 0) + 1; });
  const max = Math.max(1, ...Object.values(counts));
  const stages = [...STAGE_ORDER, ...Object.keys(counts).filter((s) => !STAGE_ORDER.includes(s))];
  return (
    <div style={S.pipeline}>
      {stages.map((s) => {
        const n = counts[s] || 0;
        return (
          <div key={s} style={S.pipeCol}>
            <div style={S.pipeBarTrack}>
              <div style={{ ...S.pipeBar, height: `${(n / max) * 100}%`, background: STAGE_COLOR(s) }} />
            </div>
            <div style={S.pipeCount}>{n}</div>
            <div style={S.pipeLabel}>{s}</div>
          </div>
        );
      })}
    </div>
  );
}

// A row is "flagged" when the parser hit something it didn't recognize and
// said so in notes (see the "unrecognized stage" / "labor code unclear"
// instructions in the parsing prompt). This is the only way problems surface
// — nothing pings you automatically, so this banner is the whole mechanism.
function isFlagged(h) {
  return !!(h.notes && /verify/i.test(h.notes));
}

// The parser's output order roughly follows the PDF's own row order, but
// that's not authoritative — corrections (like the stale trim-tier stage
// override) change a house's effective stage without moving its position in
// the list. Sort explicitly by canonical stage progression instead of
// trusting extraction order, so the display always matches reality.
function stageRank(stage) {
  const i = STAGE_ORDER.indexOf(stage);
  return i === -1 ? STAGE_ORDER.length : i; // unrecognized stages sort last
}
function sortByStage(houses) {
  return [...houses].sort((a, b) => stageRank(a.stage) - stageRank(b.stage));
}

// For multi-week views (Browse): most recent week first, stage progression
// within each week second — so same-stage rows from different weeks never
// sit adjacent looking like duplicates.
function sortByWeekThenStage(houses) {
  return [...houses].sort((a, b) => {
    if (a.weekDate !== b.weekDate) return b.weekDate.localeCompare(a.weekDate);
    return stageRank(a.stage) - stageRank(b.stage);
  });
}

function FlagBanner({ houses }) {
  const flagged = houses.filter(isFlagged);
  if (!flagged.length) return null;
  const summary = flagged.map((h) => `${h.address}: ${h.notes}`).join('\n');
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(summary);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) { /* clipboard blocked — the text is still visible below to copy by hand */ }
  };
  return (
    <div style={S.flagBanner}>
      <div style={S.flagTitle}>⚠ {flagged.length} row{flagged.length > 1 ? 's' : ''} the parser wasn't sure about</div>
      <div style={S.flagSub}>Paste this into chat with Claude so it can be taught for next time.</div>
      <pre style={S.flagText}>{summary}</pre>
      <button style={S.flagCopyBtn} onClick={copy}>{copied ? 'COPIED' : 'COPY FOR CHAT'}</button>
    </div>
  );
}

function DropZone({ onFile, busy }) {
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef(null);

  const handleFiles = (files) => {
    const file = files && files[0];
    if (file && file.type === 'application/pdf') onFile(file);
  };

  return (
    <div
      style={{ ...S.drop, ...(dragging ? S.dropActive : {}), ...(busy ? S.dropBusy : {}) }}
      onDragOver={(e) => { e.preventDefault(); if (!busy) setDragging(true); }}
      onDragLeave={() => setDragging(false)}
      onDrop={(e) => { e.preventDefault(); setDragging(false); if (!busy) handleFiles(e.dataTransfer.files); }}
      onClick={() => !busy && inputRef.current && inputRef.current.click()}
    >
      <input ref={inputRef} type="file" accept="application/pdf" style={{ display: 'none' }}
        onChange={(e) => handleFiles(e.target.files)} />
      <div style={S.dropIcon}>{busy ? '···' : '⇩'}</div>
      <div style={S.dropTitle}>{busy ? 'Reading the schedule…' : 'Drop this week\u2019s schedule PDF'}</div>
      <div style={S.dropSub}>{busy ? 'This can take a few seconds' : 'or tap to browse — one page at a time'}</div>
    </div>
  );
}

function AskBar({ onAsk, asking, answer, answerError }) {
  const [question, setQuestion] = useState('');
  const [placeholderIdx, setPlaceholderIdx] = useState(0);

  useEffect(() => {
    const t = setInterval(() => setPlaceholderIdx((i) => (i + 1) % ASK_EXAMPLES.length), 3200);
    return () => clearInterval(t);
  }, []);

  const submit = () => {
    if (!question.trim() || asking) return;
    onAsk(question.trim());
  };

  return (
    <div style={S.askWrap}>
      <div style={S.askRow}>
        <input
          style={S.askInput}
          value={question}
          onChange={(e) => setQuestion(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && submit()}
          placeholder={`Ask something — e.g. "${ASK_EXAMPLES[placeholderIdx]}"`}
        />
        <button style={S.askBtn} onClick={submit} disabled={asking || !question.trim()}>
          {asking ? '···' : 'ASK'}
        </button>
      </div>
      {answerError && <div style={S.askError}>{answerError}</div>}
      {answer && !answerError && <div style={S.askAnswer}>{answer}</div>}
    </div>
  );
}

const DATE_RANGES = [
  { key: '4w', label: '4 WEEKS', days: 28 },
  { key: '3m', label: '3 MONTHS', days: 92 },
  { key: '6m', label: '6 MONTHS', days: 183 },
  { key: '1y', label: '1 YEAR', days: 366 },
  { key: 'all', label: 'ALL TIME', days: null },
];

function withinRange(weekDate, rangeKey) {
  if (rangeKey === 'all') return true;
  const range = DATE_RANGES.find((r) => r.key === rangeKey);
  if (!range || !range.days) return true;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - range.days);
  return new Date(weekDate + 'T00:00:00') >= cutoff;
}

function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}

// Construction convention: weekends don't count as working days. Used for
// the timeline chart specifically — daysBetween (calendar days) stays as-is
// for anything else that needs a raw date difference.
function businessDaysBetween(a, b) {
  let start = new Date(a + 'T00:00:00');
  let end = new Date(b + 'T00:00:00');
  if (end < start) { const t = start; start = end; end = t; }
  let count = 0;
  const cur = new Date(start);
  cur.setDate(cur.getDate() + 1);
  while (cur <= end) {
    const day = cur.getDay();
    if (day !== 0 && day !== 6) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

// Builds day-count segments for one address across every week it's been
// seen, entirely from data already on hand — no AI call, no cost. Each
// segment covers the gap between one snapshot and the next; the final
// segment runs from the last snapshot to today and is marked "ongoing"
// since the house may have moved on since the last upload.
// Merges consecutive same-stage snapshots into one continuous run (so a
// house showing "Roof" two weeks running is one bar segment, not two), then
// for each transition prefers the actual recorded statusDate difference —
// the specific dates written on the sheet — over the raw gap between
// uploads, since the sheet's own dates are more precise than how often you
// happen to upload. Falls back to upload-date gaps only when a statusDate
// isn't available on one side of the transition.
function buildTimeline(rows) {
  const sorted = [...rows].sort((a, b) => a.weekDate.localeCompare(b.weekDate));

  const runs = [];
  sorted.forEach((r) => {
    const last = runs[runs.length - 1];
    if (last && last.stage === r.stage) last.snapshots.push(r);
    else runs.push({ stage: r.stage, snapshots: [r] });
  });

  // A snapshot's statusDate is only trustworthy as "this already happened"
  // when it's on or before the report (weekDate) it appeared on. A
  // statusDate AFTER its own report date is a scheduled target for that
  // stage, not a confirmed fact — and definitely not evidence about when
  // the PREVIOUS stage finished. In that case, fall back to the report date
  // itself, which is the one thing we know for certain: as of this report,
  // the house had moved on.
  function confirmedDate(snap) {
    if (snap.statusDate && daysBetween(snap.statusDate, snap.weekDate) >= 0) return snap.statusDate;
    return snap.weekDate;
  }

  const segments = [];
  for (let i = 0; i < runs.length; i++) {
    const run = runs[i];
    const isLast = i === runs.length - 1;
    const firstSnap = run.snapshots[0];
    let days, precise = false;

    if (!isLast) {
      const nextFirstSnap = runs[i + 1].snapshots[0];
      const start = confirmedDate(firstSnap);
      const end = confirmedDate(nextFirstSnap);
      days = businessDaysBetween(start, end);
      precise = start === firstSnap.statusDate && end === nextFirstSnap.statusDate;
    } else {
      // Ongoing — from the earliest confirmed date for this run to today.
      const start = confirmedDate(firstSnap);
      days = businessDaysBetween(start, new Date().toISOString().slice(0, 10));
    }

    segments.push({ stage: run.stage, days: Math.max(1, days), ongoing: isLast, precise, weeksSeen: run.snapshots.length });
  }
  return segments;
}

function HouseTimeline({ address, rows }) {
  const segments = buildTimeline(rows);
  const totalDays = segments.reduce((sum, s) => sum + s.days, 0) || 1;
  if (!segments.length) return null;
  return (
    <div style={S.timelineWrap}>
      <div style={S.timelineTitle}>{address} — stage duration in business days (weekends excluded) from your saved weeks (no AI). Plain numbers use the sheet's own recorded dates; "~" means estimated from how often you happened to upload.</div>
      <div style={S.timelineBar}>
        {segments.map((s, i) => (
          <div key={i} style={{ flex: s.days, minWidth: 2, background: STAGE_COLOR(s.stage), position: 'relative' }} title={`${s.stage}: ${s.days} day${s.days === 1 ? '' : 's'}`} />
        ))}
      </div>
      <div style={S.timelineLegend}>
        {segments.map((s, i) => {
          const drift = s.ongoing ? classifyDrift(s.stage, s.days, s.weeksSeen) : null;
          const stallMode = drift && DURATION_BASELINE[s.stage] && DURATION_BASELINE[s.stage].max <= STALL_MODE_MAX_DAYS;
          return (
            <div key={i} style={S.timelineLegendItem}>
              <span style={{ ...S.timelineDot, background: STAGE_COLOR(s.stage) }} />
              <span style={S.timelineLegendStage}>{s.stage}</span>
              <span style={S.timelineLegendDays}>{s.precise || s.ongoing ? '' : '~'}{s.days}d{s.ongoing ? ' (ongoing)' : ''}</span>
              {drift && drift !== 'normal' && (
                <span style={{ ...S.driftBadge, color: DRIFT_META[drift].color, borderColor: DRIFT_META[drift].color + '55', background: DRIFT_META[drift].color + '18' }}>
                  {DRIFT_META[drift].label} — {stallMode
                    ? `unchanged ${s.weeksSeen} uploads running`
                    : `baseline ${DURATION_BASELINE[s.stage].min}-${DURATION_BASELINE[s.stage].max}d`}
                </span>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Scans every house's most recent snapshot run to find ones currently running
// long or stuck against DURATION_BASELINE. Pure client-side arithmetic on data
// already loaded for Browse — no AI call, no extra backend round-trip.
function findAttentionHouses(allRows) {
  const byAddress = {};
  allRows.forEach((r) => { (byAddress[r.address] = byAddress[r.address] || []).push(r); });
  const results = [];
  Object.entries(byAddress).forEach(([address, rows]) => {
    const segments = buildTimeline(rows);
    const last = segments[segments.length - 1];
    if (!last || !last.ongoing) return;
    const drift = classifyDrift(last.stage, last.days, last.weeksSeen);
    if (drift === 'watch' || drift === 'stuck') {
      const baseline = DURATION_BASELINE[last.stage];
      const stallMode = baseline.max <= STALL_MODE_MAX_DAYS;
      results.push({ address, stage: last.stage, days: last.days, weeksSeen: last.weeksSeen, drift, baseline, stallMode });
    }
  });
  // Stuck-before-watch, then worst first within each — stall mode ranks by weeks
  // unchanged (there's no meaningful day-count to rank it by), duration mode by
  // how far past the baseline max it's run.
  const severity = { stuck: 1, watch: 0 };
  return results.sort((a, b) => {
    if (severity[b.drift] !== severity[a.drift]) return severity[b.drift] - severity[a.drift];
    const aOver = a.stallMode ? a.weeksSeen : a.days - a.baseline.max;
    const bOver = b.stallMode ? b.weeksSeen : b.days - b.baseline.max;
    return bOver - aOver;
  });
}

function AttentionPanel({ allRows }) {
  const houses = findAttentionHouses(allRows);
  if (!houses.length) return null;
  return (
    <div style={S.attentionWrap}>
      <div style={S.attentionTitle}>⚑ {houses.length} house{houses.length > 1 ? 's' : ''} not moving normally for their current stage</div>
      <div style={S.attentionList}>
        {houses.map((h, i) => (
          <div key={i} style={S.attentionRow}>
            <span style={S.attentionAddress}>{h.address}</span>
            <span style={{ ...S.stagePill, background: STAGE_COLOR(h.stage) + '22', color: STAGE_COLOR(h.stage), borderColor: STAGE_COLOR(h.stage) + '55' }}>{h.stage}</span>
            <span style={{ ...S.driftBadge, color: DRIFT_META[h.drift].color, borderColor: DRIFT_META[h.drift].color + '55', background: DRIFT_META[h.drift].color + '18' }}>
              {DRIFT_META[h.drift].label} — {h.stallMode
                ? `unchanged ${h.weeksSeen} uploads running`
                : `${h.days}d (baseline ${h.baseline.min}-${h.baseline.max}d)`}
            </span>
          </div>
        ))}
      </div>

}

function BrowseScreen({ allRows, loading, onAsk, asking, answer, answerError }) {
  const [subdivision, setSubdivision] = useState('');
  const [superintendent, setSuperintendent] = useState('');
  const [stage, setStage] = useState('');
  const [range, setRange] = useState('3m');
  const [addressQuery, setAddressQuery] = useState('');

  const subdivisions = Array.from(new Set(allRows.map((r) => r.subdivision).filter(Boolean))).sort();
  const stages = Array.from(new Set(allRows.map((r) => r.stage).filter(Boolean))).sort((a, b) => stageRank(a) - stageRank(b));

  const filtered = sortByWeekThenStage(allRows.filter((r) => {
    if (subdivision && r.subdivision !== subdivision) return false;
    if (superintendent && SUBDIVISION_SUPERINTENDENT[r.subdivision] !== superintendent) return false;
    if (stage && r.stage !== stage) return false;
    if (addressQuery && !r.address.toLowerCase().includes(addressQuery.toLowerCase())) return false;
    if (!withinRange(r.weekDate, range)) return false;
    return true;
  }));

  // If the address search narrows things to exactly one house, show its full
  // history (every week it's ever appeared in, ignoring the date-range
  // filter) as a timeline instead of just a table row per week.
  const matchedAddresses = addressQuery ? Array.from(new Set(filtered.map((r) => r.address))) : [];
  const singleAddress = matchedAddresses.length === 1 ? matchedAddresses[0] : null;
  const timelineRows = singleAddress ? allRows.filter((r) => r.address === singleAddress) : [];

  return (
    <div>
      <AskBar onAsk={onAsk} asking={asking} answer={answer} answerError={answerError} />

      {!loading && <AttentionPanel allRows={allRows} />}

      <div style={S.filterRow}>
        <input style={S.select} placeholder="Search address…" value={addressQuery} onChange={(e) => setAddressQuery(e.target.value)} />
        <select style={S.select} value={subdivision} onChange={(e) => setSubdivision(e.target.value)}>
          <option value="">All subdivisions</option>
          {subdivisions.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        <select style={S.select} value={superintendent} onChange={(e) => setSuperintendent(e.target.value)}>
          <option value="">All superintendents</option>
          {Array.from(new Set(Object.values(SUBDIVISION_SUPERINTENDENT))).map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        <select style={S.select} value={stage} onChange={(e) => setStage(e.target.value)}>
          <option value="">All stages</option>
          {stages.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      <div style={S.rangeRow}>
        {DATE_RANGES.map((r) => (
          <button key={r.key} style={range === r.key ? S.rangeBtnActive : S.rangeBtn} onClick={() => setRange(r.key)}>{r.label}</button>
        ))}
      </div>

      {singleAddress && <HouseTimeline address={singleAddress} rows={timelineRows} />}

      {loading ? (
        <div style={S.emptyState}>Loading all weeks…</div>
      ) : !filtered.length ? (
        <div style={S.emptyState}>No rows match those filters.</div>
      ) : (
        <div style={S.tableWrap}>
          <table style={S.table}>
            <thead>
              <tr>{['Address', 'Subdivision', 'Stage', 'Status Date', 'Labor'].map((h) => <th key={h} style={S.th}>{h}</th>)}</tr>
            </thead>
            <tbody>
              {filtered.map((h, i) => {
                const newWeek = i === 0 || filtered[i - 1].weekDate !== h.weekDate;
                return (
                  <React.Fragment key={i}>
                    {newWeek && (
                      <tr>
                        <td colSpan={5} style={S.weekHeaderRow}>{fmtDate(h.weekDate) || h.weekDate}</td>
                      </tr>
                    )}
                    <tr style={{ ...S.tr, ...(isFlagged(h) ? S.trFlagged : {}) }}>
                      <td style={S.td}>{h.address}</td>
                      <td style={S.td}>{h.subdivision || <span style={{ opacity: 0.35 }}>—</span>}</td>
                      <td style={S.td}><span style={{ ...S.stagePill, background: STAGE_COLOR(h.stage) + '22', color: STAGE_COLOR(h.stage), borderColor: STAGE_COLOR(h.stage) + '55' }}>{h.stage}</span></td>
                      <td style={S.td}>{fmtDate(h.statusDate) || '—'}</td>
                      <td style={S.td}>{h.labor || '—'}</td>
                    </tr>
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function WeeksList({ weeks, onOpen, loading }) {
  if (loading) return <div style={S.emptyState}>Loading past weeks…</div>;
  if (!weeks.length) return <div style={S.emptyState}>No weeks saved yet. Upload one above to get started.</div>;

    <div style={S.stack}>

}

function WeekDetail({ weekDate, houses, onBack, onDelete, deleting }) {
  const [confirming, setConfirming] = useState(false);
  return (
    <div>
      <div style={S.ph}>
        <button style={S.gBtn} onClick={onBack}>← ALL WEEKS</button>

          <div style={{ display: 'flex', gap: 8 }}>

      <div style={S.tableWrap}>

          <thead>

                <td style={S.td}>{h.address}</td>
                <td style={S.td}>{h.subdivision || <span style={{ opacity: 0.35 }}>—</span>}</td>
                <td style={S.td}><span style={{ ...S.stagePill, background: STAGE_COLOR(h.stage) + '22', color: STAGE_COLOR(h.stage), borderColor: STAGE_COLOR(h.stage) + '55' }}>{h.stage}</span></td>
                <td style={S.td}>{fmtDate(h.statusDate) || '—'}</td>
                <td style={S.td}>{fmtDate(h.matlArrivalDate) || '—'}</td>

          </tbody>
        </table>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('upload'); // upload | review | weeks | weekDetail | browse
  const [parsed, setParsed] = useState(null);
  const [busy, setBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const [toast, setToast] = useState(null);
  const [weeks, setWeeks] = useState([]);
  const [weeksLoading, setWeeksLoading] = useState(false);
  const [activeWeek, setActiveWeek] = useState(null);
  const [activeWeekHouses, setActiveWeekHouses] = useState([]);
  const [deleting, setDeleting] = useState(false);
  const [allRows, setAllRows] = useState([]);
  const [allRowsLoading, setAllRowsLoading] = useState(false);
  const [allRowsLoaded, setAllRowsLoaded] = useState(false);
  const [asking, setAsking] = useState(false);
  const [answer, setAnswer] = useState(null);
  const [answerError, setAnswerError] = useState(null);

  const configured = SCRIPT_URL.indexOf('PASTE_') !== 0 && APP_TOKEN.indexOf('PASTE_') !== 0;

  const loadWeeks = async () => {
    setWeeksLoading(true);
    try {
      const result = await callBackendGet('listWeeks');
      setWeeks(result || []);
    } catch (e) { /* silent on the tab switch — user hasn't asked for it yet */ }
    setWeeksLoading(false);
  };

  // Fetches every week's rows once and caches them for the Browse tab —
  // filtering then happens client-side, no repeat network calls per filter change.
  const loadAllRows = async (force) => {
    if (allRowsLoaded && !force) return;
    setAllRowsLoading(true);
    try {
      const weekList = await callBackendGet('listWeeks');
      const perWeek = await Promise.all((weekList || []).map((w) => callBackendGet('getWeek', { weekDate: w })));
      setAllRows(perWeek.flat());
      setAllRowsLoaded(true);
    } catch (e) {
      setError(e.message);
    }
    setAllRowsLoading(false);
  };

  const handleAsk = async (question) => {
    setAsking(true);
    setAnswer(null);
    setAnswerError(null);
    try {
      const result = await callBackendPost('askQuestion', { question });
      setAnswer(result.answer);
    } catch (e) {
      setAnswerError(e.message || 'Something went wrong answering that.');
    }
    setAsking(false);
  };

  useEffect(() => { if (configured) loadWeeks(); }, []);

  const handleFile = async (file) => {
    setBusy(true);
    setError(null);
    try {
      const base64 = await fileToBase64(file);
      const result = await callBackendPost('parseWeek', { pdfBase64: base64 });
      setParsed(result);
      setView('review');
    } catch (e) {
      setError(e.message || 'Something went wrong parsing that file.');
    }
    setBusy(false);
  };

  const handleSave = async (weekDate, houses) => {
    setSaving(true);
    try {
      const result = await callBackendPost('saveWeek', { weekDate, houses });
      setToast(`Saved ${result.saved} houses for ${fmtDate(weekDate) || weekDate}.`);
      setTimeout(() => setToast(null), 4000);
      setParsed(null);
      setView('upload');
      loadWeeks();
    } catch (e) {
      setError(e.message || 'Save failed.');
    }
    setSaving(false);
  };

  const openWeek = async (weekDate) => {
    setActiveWeek(weekDate);
    setView('weekDetail');
    try {
      const houses = await callBackendGet('getWeek', { weekDate });
      setActiveWeekHouses(houses || []);
    } catch (e) {
      setError(e.message);
    }
  };

  const handleDeleteWeek = async (weekDate) => {
    setDeleting(true);
    try {
      await callBackendPost('deleteWeek', { weekDate });
      setToast(`Deleted ${fmtDate(weekDate) || weekDate}.`);
      setTimeout(() => setToast(null), 4000);
      setView('weeks');
      loadWeeks();
    } catch (e) {
      setError(e.message);
    }
    setDeleting(false);
  };

  if (!configured) {
    return (
      <div style={S.app}>
        <div style={S.body}>
          <div style={S.banner}>
            ⚙ Open <strong>schedule-trend.html</strong> and set <code>SCRIPT_URL</code> and <code>APP_TOKEN</code> at the top of the script before using this.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={S.app}>
      <div style={S.header}>
        <div style={S.logo}>SCHEDULE TREND</div>
        <div style={S.nav}>
          <button style={{ ...S.navBtn, ...(view === 'browse' ? S.navActive : {}) }} onClick={() => { setView('browse'); loadAllRows(); }}>BROWSE</button>
          <button style={{ ...S.navBtn, ...(view === 'weeks' || view === 'weekDetail' ? S.navActive : {}) }} onClick={() => { setView('weeks'); loadWeeks(); }}>WEEKS</button>
          <button style={{ ...S.navBtn, ...(view === 'upload' || view === 'review' ? S.navActive : {}) }} onClick={() => { setView('upload'); setParsed(null); }}>UPLOAD</button>
        </div>
      </div>

      {toast && <div style={S.toast}>{toast}</div>}

      <div style={S.body}>
        {error && <div style={S.errorBox}>{error} <span style={S.errorDismiss} onClick={() => setError(null)}>✕</span></div>}

        {view === 'upload' && <DropZone onFile={handleFile} busy={busy} />}

        {view === 'review' && parsed && (
          <ReviewScreen parsed={parsed} saving={saving}
            onSave={handleSave}
            onDiscard={() => { setParsed(null); setView('upload'); }} />
        )}

        {view === 'browse' && (
          <BrowseScreen allRows={allRows} loading={allRowsLoading}
            onAsk={handleAsk} asking={asking} answer={answer} answerError={answerError} />
        )}

        {view === 'weeks' && <WeeksList weeks={weeks} loading={weeksLoading} onOpen={openWeek} />}

        {view === 'weekDetail' && <WeekDetail weekDate={activeWeek} houses={activeWeekHouses} onBack={() => setView('weeks')} onDelete={handleDeleteWeek} deleting={deleting} />}
      </div>
    </div>
  );
}
